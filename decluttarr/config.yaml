# decluttarr/config.yaml — which downloads Decluttarr may replace (docs/phases.md →
# "Download health"). Mounted read-only; secrets come from .env through !ENV.
#
# It watches the Radarr/Sonarr queues, i.e. downloads that have NOT been imported,
# and removes one that stalls or crawls with its partial data, blocklists that
# release and has the app search for another. Anything already imported has left
# the queue, so it is never touched here; arr-reclaim.sh owns those (trap 9), and a
# removed download never reaches its import history.
#
# A job is ON as soon as its key is listed under `jobs:`, even with no value. So
# list only the three wanted ones — tests/decluttarr-config.test.sh fails on any
# other. Deliberately absent:
#   remove_orphans         removes torrents whose media left the arr; one deleted in
#                          Plex is arr-reclaim's to judge, not this
#   remove_unmonitored     media is unmonitored after its first import
#                          (autoUnmonitorPreviouslyDownloaded*), so upgrades would go
#   remove_missing_files, remove_failed_imports, remove_failed_downloads,
#   remove_bad_files, remove_done_seeding
#                          file and seeding decisions stay with the arrs, qBittorrent's
#                          share limits and arr-reclaim
#   search_missing, search_unmet_cutoff, detect_deletions
#                          searching stays with the arrs and Seerr

general:
  log_level: INFO
  test_run: !ENV DECLUTTARR_TEST_RUN
  timer: 10                # minutes between checks

job_defaults:
  max_strikes: 3           # three checks in a row (~20-30 min) before a removal

jobs:
  # qBittorrent reports no connections at all.
  remove_stalled:
  # Under 500 KB/s (~4 Mbit/s, a tenth of the ~50 Mbit/s line) averaged between
  # checks. It pauses itself while qBittorrent uses over 80% of its global
  # download limit (dl_limit in qbt-configure.sh), so a download that is only
  # sharing a busy line is not counted as slow.
  remove_slow:
    min_speed: 500
  # A magnet that never finds anyone to send its metadata.
  remove_metadata_missing:

instances:
  radarr:
    - base_url: "http://radarr:7878"
      api_key: !ENV RADARR_API_KEY
  sonarr:
    - base_url: "http://sonarr:8989"
      api_key: !ENV SONARR_API_KEY

download_clients:
  qbittorrent:
    # "qbittorrent" is in its WebUI host allowlist (qbt-configure.sh); the name
    # matches the download client Radarr and Sonarr know it by (arr-configure.sh).
    - base_url: "http://qbittorrent:8081"
      username: !ENV QBT_ARR_USER
      password: !ENV QBT_ARR_PASS
      name: "qBittorrent"
