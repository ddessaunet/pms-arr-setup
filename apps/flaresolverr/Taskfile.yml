version: '3'

# flaresolverr — see README.md. Its tasks come from the templates in
# stack/taskfiles/; SERVICE is the compose service they act on.

includes:
  service:  { taskfile: ../../stack/taskfiles/service.yml, flatten: true, vars: { SERVICE: flaresolverr } }
  update:   { taskfile: ../../stack/taskfiles/update.yml, flatten: true, vars: { SERVICE: flaresolverr } }
