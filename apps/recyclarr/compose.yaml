# recyclarr — TRaSH quality profiles, on demand (Phase 6). Included by the
# root compose.yaml (project `pms`).
#
# Syncs TRaSH's quality profiles and custom formats from recyclarr.yml (beside
# this file) into Radarr and Sonarr. Profile `tools`: never started by
# `task start`; run it with `task recyclarr:preview` / `recyclarr:sync` (a
# one-shot container).

services:
  recyclarr:
    profiles: [tools]
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    environment:
      TZ: ${TZ:?set TZ in .env}
      RADARR_API_KEY: ${RADARR_API_KEY:?set RADARR_API_KEY in .env}
      SONARR_API_KEY: ${SONARR_API_KEY:?set SONARR_API_KEY in .env}
    volumes:
      - ${APPDATA:?set APPDATA in .env}/recyclarr:/config
      - ./recyclarr.yml:/config/recyclarr.yml:ro
    networks: [arr]
