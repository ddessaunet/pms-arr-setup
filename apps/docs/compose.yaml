# docs — this repo's documentation website, LAN only. Included by the root
# compose.yaml (project `pms`).
#
# Serves site/dist, the static site `task site:build` writes on the host
# (Starlight; nothing builds in the container). The bind is site/, not
# site/dist: the build writes a new dist beside the old one and swaps them, and
# a bind of dist itself would keep serving the folder that was swapped out.
# It is a relative bind, so create the container from the main clone only
# (CLAUDE.md trap 16): from a worktree it would serve that worktree's build.
#
# Unprivileged nginx (uid 101, port 8080 inside), read-only root filesystem.
# Not on the arr network: it talks to nothing.
#
# /live is the dashboard's data, written every 2 minutes by jobs/stack-status
# (redacted: it is readable by anyone on the LAN). Create the directory as
# yourself before the first `up`, or Docker creates it root-owned and the job
# cannot write: install -d -m 755 /opt/appdata/docs-status

services:
  docs:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: docs
    ports:
      - "8088:8080"
    volumes:
      - ../../site:/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APPDATA:?set APPDATA in .env}/docs-status:/live:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
