# nginx for apps/docs: serves the built site (site/dist, mounted at /site),
# behind the owner's Plex sign-in, which jobs/stack-api runs.
server {
    listen 8080;
    root /site/dist;
    index index.html;
    server_tokens off;

    # Published as 8088:8080. Astro writes /x/index.html, so /x gets a 301 to
    # /x/; an absolute Location would name the container's :8080. A relative
    # one keeps the port the browser used.
    absolute_redirect off;

    # ─── the gate ─────────────────────────────────────────────────────────────
    # Every request asks stack-api first (its socket, mounted at /api): 204 is
    # a signed-in owner, 401 is anyone else. Only /login/, the build's assets
    # and /api/ itself (which checks its own routes) skip it. A page answers
    # 401 with the login page; /live/ with JSON, for the polling scripts. If
    # stack-api is down the subrequest fails, nginx answers 500, and that goes
    # to the login page too, which says so: the gate fails closed.
    auth_request /_auth;
    error_page 401 = @signin;
    error_page 500 = @signin;

    location = /_auth {
        internal;
        proxy_pass http://unix:/api/api.sock:/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
    # The page asked for comes back as ?next=. $request_uri, never $uri: it is
    # still percent-encoded, so an encoded CR/LF cannot split the header.
    location @signin {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 302 /login/?next=$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /login/ {
        auth_request off;
        try_files $uri $uri/ =404;
    }
    location = /favicon.svg {
        auth_request off;
    }

    # Astro's assets have content hashes in their names: cache them for good.
    # Open: the login page needs its styles and script. They are the build's
    # code, fonts and styles; the data the pages show is in the pages and /live/.
    location /_astro/ {
        auth_request off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # stack-api: the sign-in, and everything the pages ask it. It checks the
    # session itself, so no auth_request here. Host is the browser's, which
    # its same-origin check compares with Origin; X-Real-IP is what its rate
    # limits count by. No buffering, for streamed answers.
    location /api/ {
        auth_request off;
        proxy_pass http://unix:/api/api.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 180s;
        access_log off;
        error_page 502 504 = @api_down;
    }
    location @api_down {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"stack-api is not answering"}';
    }

    # Maintainerr, which has no login of its own and can delete the library: it
    # is reached only here, behind the gate above (apps/maintainerr publishes
    # 6246 on 127.0.0.1 only). It serves under BASE_PATH=/maintainerr, so the
    # path goes through as it is. The upstream is a variable, resolved by
    # Docker's DNS per request: a fixed one would stop nginx from starting, and
    # the whole site with it, while Maintainerr is down. Its error_page lines
    # replace the server's, so the gate's two are repeated.
    location = /maintainerr {
        return 301 /maintainerr/;
    }
    location /maintainerr/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $maintainerr http://maintainerr:6246;
        proxy_pass $maintainerr;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Its live updates are a long-lived event stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
        error_page 401 = @signin;
        error_page 500 = @signin;
        error_page 502 504 = @maintainerr_down;
    }
    location @maintainerr_down {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 'Maintainerr is not answering: task maintainerr:ps, task maintainerr:logs\n';
    }

    # The dashboard's live data: jobs/stack-status writes status.json, logs.json
    # and drift.json into /opt/appdata/docs-status, mounted here read-only. The
    # page polls every 30 s, so: never cached, and no access log (the polling
    # would bury everything else, and this container's log is on the page too).
    # No try_files: with alias it misbehaves. Dotfiles are the job's temp files
    # mid-write.
    location /live/ {
        alias /live/;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        # Before the job's first run nothing is there: answer 404 quietly here,
        # not through the site's 404 page, whose location logs every poll.
        log_not_found off;
        error_page 404 = @live_missing;
        error_page 401 = @live_signed_out;
        error_page 500 = @live_signed_out;
        gzip on;
        gzip_types application/json;
        location ~ /\. { deny all; }
    }
    location @live_missing {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not written yet: jobs/stack-status"}';
    }
    location @live_signed_out {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"signed out"}';
    }

    error_page 404 /404.html;
}
