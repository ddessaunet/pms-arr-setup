version: '3'

# site/ — the docs website (Starlight), the source of what apps/docs serves.
# Not an app: it has no container. `build` writes site/dist; `task deploy`
# builds it and copies it into the install, whose site/dist apps/docs (nginx)
# serves. Built on the host with Bun, the same one the scripts run on
# (.bun-version; proto or Homebrew): it installs the packages, as bun.lock
# says, and runs Astro and Vite+ under `bun --bun`, so node is not needed.
# Lint, format and tests are Vite+ (`vp`, configured in vite.config.ts); the
# build is Astro's own.

env:
  ASTRO_TELEMETRY_DISABLED: '1'

tasks:
  install:
    desc: Install the site's packages, exactly as bun.lock says
    preconditions:
      - sh: command -v bun
        msg: bun is not on PATH (proto install bun, then proto pin bun <version> --to global; see the README).
    sources: [package.json, bun.lock]
    generates: [node_modules/.bin/astro, node_modules/.bin/vp]
    cmds:
      - bun install --frozen-lockfile

  dev:
    desc: Live preview on :4321, reachable from the LAN (publishes nothing)
    deps: [install]
    cmds:
      - bun --bun astro dev --host {{.CLI_ARGS}}

  lint:
    desc: Lint the site and check its formatting (changes nothing; task site:fmt fixes the formatting)
    deps: [install]
    cmds:
      - bun --bun vp check

  fmt:
    desc: Rewrite the site's files in its format
    deps: [install]
    cmds:
      - bun --bun vp fmt

  test:
    desc: The site's unit tests — reading the profiles and checking them against recyclarr.yml
    deps: [install]
    cmds:
      - bun --bun vp test

  check:
    desc: Prove the site builds, into a scratch folder (publishes nothing)
    deps: [install]
    cmds:
      - defer: rm -rf .dist-check
      - bun --bun astro build --outDir .dist-check

  screenshot:
    desc: 'Screenshots of the site with made-up data, for PR descriptions: -- [scene…] (site/screenshots/scenes.ts; --list names them)'
    deps: [install]
    preconditions:
      - sh: ls -d "$HOME"/.cache/ms-playwright/chromium_headless_shell-* >/dev/null 2>&1
        msg: Playwright has no Chromium yet (task site:screenshot:install).
    cmds:
      - bun --bun screenshots/shoot.ts {{.CLI_ARGS}}

  screenshot:install:
    desc: Download the headless Chromium task site:screenshot runs (~120 MB, into ~/.cache/ms-playwright; no sudo)
    deps: [install]
    cmds:
      - bunx --bun playwright install chromium-headless-shell
      # Its one library the box lacks; installing it is the owner's (sudo).
      - cmd: ldconfig -p | grep -q libasound.so.2 || echo 'Chromium also needs libasound.so.2 - sudo apt install libasound2t64'

  build:
    desc: Build, then swap the result into site/dist (task deploy publishes it)
    deps: [install]
    cmds:
      # Astro empties its outDir before rendering, so building in place would
      # leave nginx an empty site, or a broken build serving nothing. Build
      # beside it, and swap only once the build succeeded.
      - defer: rm -rf .dist-next   # a failed build's leftovers
      - rm -rf .dist-next
      - bun --bun astro build --outDir .dist-next
      - |
        rm -rf .dist-prev
        if [ -d dist ]; then mv dist .dist-prev; fi
        mv .dist-next dist
        rm -rf .dist-prev
