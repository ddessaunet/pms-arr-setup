# Runs the offline checks on every PR, through the same task entry points a
# person uses: `task lint test` for the stack (shellcheck, Vite+ and tsc, every
# *.test.sh and bun test), `task site:lint site:test site:check` for the docs
# site. Nothing here starts containers or installs units (trap 16): lint only
# renders compose.yaml, and the suites stand in for docker, systemctl and the
# apps' APIs.
#
# A change to Markdown files only (*.md: READMEs, docs/, CLAUDE.md, DESIGN.md)
# skips both. They are required checks on main, so they are skipped, not left
# out with paths-ignore: a skipped job counts as passed, a missing one blocks
# the merge. The site's own pages are .mdx and still run. If the diff can't be
# read, both run.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: code changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A PR checks out its merge commit, whose first parent is main.
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then base=HEAD^1; else base=$BEFORE; fi
          if ! files="$(git diff --name-only "$base" HEAD)"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          if grep -qvE '\.md$' <<<"$files"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  stack:
    name: task lint test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without task, layout.test.sh skips the per-app task lists.
      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      # The box runs shellcheck 0.11.0; ubuntu's apt has an older one that
      # flags different things. jq and docker compose come with the runner.
      - name: Install shellcheck 0.11.0
        run: |
          f=shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$f"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $f" | sha256sum -c -
          tar -xJf "$f"
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          rm -rf "$f" shellcheck-v0.11.0
          shellcheck --version

      # The stack's TypeScript runs on Bun: the version the box pins (.bun-version).
      # task lint installs the dev tools from bun.lock (bun:install).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: task lint test

  site:
    # The name is the required check on main (the ruleset), so it stays as it
    # was when site:lint joined the job. Rename both together.
    name: task site:test site:check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The site builds on the same Bun as the scripts (.bun-version); site:install
      # installs its packages from site/bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      - run: task site:lint site:test site:check
