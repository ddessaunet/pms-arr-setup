version: '3'

# pms-update — see README.md. Run Sundays at 05:00 by pms-update.timer;
# `task deploy` installs it and arms the timer while native Plex is masked or
# gone. `task update` / `task <app>:update` reach the same script.

tasks:
  run:
    desc: Update every service in UPDATE_SERVICES now (install only)
    preconditions:
      - sh: ../../stack/installed.sh
        msg: Run it from the install (default /opt/arr-setup; task deploy makes it), not a source tree.
    cmds:
      - ./update-stack.sh {{.CLI_ARGS}}

  dry:
    desc: Pull and report; recreates nothing
    cmds:
      - ./update-stack.sh --dry-run {{.CLI_ARGS}}

  logs:
    desc: The last runs' journal
    cmds:
      - journalctl -u pms-update.service -n 100 --no-pager
