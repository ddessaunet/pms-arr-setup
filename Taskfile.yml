version: '3'

# The task runner for this repo (https://taskfile.dev, task >= 3.44).
#
#   task --list                 every task, with what it does
#   task <app>:<verb>           one app: logs, ps, up, update, configure, check
#   task <verb>                 the whole stack: start, stop, status, check, deploy
#
# Every app in apps/ and job in jobs/ is included here under its own name. The
# per-app verbs come from stack/taskfiles/ (see README → "The app contract");
# stack/layout.test.sh fails when an app is missing here or in compose.yaml.
#
# The repo is a source; the stack runs from its install (default
# /opt/arr-setup), which `task deploy` fills. The same tasks work in both:
# tasks that change containers run only in the install (stack/installed.sh),
# because compose.yaml fixes the project name, so any tree would act on the
# live stack. The install has no site/ source, hence the optional include.

includes:
  plex:                { taskfile: apps/plex,                dir: apps/plex }
  qbittorrent:         { taskfile: apps/qbittorrent,         dir: apps/qbittorrent, aliases: [qbt] }
  prowlarr:            { taskfile: apps/prowlarr,            dir: apps/prowlarr }
  flaresolverr:        { taskfile: apps/flaresolverr,        dir: apps/flaresolverr }
  radarr:              { taskfile: apps/radarr,              dir: apps/radarr }
  sonarr:              { taskfile: apps/sonarr,              dir: apps/sonarr }
  seerr:               { taskfile: apps/seerr,               dir: apps/seerr }
  recyclarr:           { taskfile: apps/recyclarr,           dir: apps/recyclarr }
  decluttarr:          { taskfile: apps/decluttarr,          dir: apps/decluttarr }
  bazarr:              { taskfile: apps/bazarr,              dir: apps/bazarr }
  docs:                { taskfile: apps/docs,                dir: apps/docs }
  arr-reclaim:         { taskfile: jobs/arr-reclaim,         dir: jobs/arr-reclaim }
  arr-fallback-search: { taskfile: jobs/arr-fallback-search, dir: jobs/arr-fallback-search }
  pms-update:          { taskfile: jobs/pms-update,          dir: jobs/pms-update }
  lan-address:         { taskfile: jobs/lan-address,         dir: jobs/lan-address }
  stack-status:        { taskfile: jobs/stack-status,        dir: jobs/stack-status }
  # Not an app: the docs website's source. apps/docs serves what `site:build` writes.
  site:                { taskfile: site,                     dir: site, optional: true }

vars:
  # The apps with a configure.sh, in the order trap 11 applies them.
  CONFIGURED: qbittorrent prowlarr radarr sonarr seerr bazarr plex

tasks:
  start:
    desc: Preflight, then start every service the current phase has enabled (install only)
    preconditions:
      - sh: stack/installed.sh
        msg: Run it from the install (default /opt/arr-setup; task deploy makes it), not a source tree.
    cmds:
      - stack/start.sh

  stop:
    desc: Stop the stack; containers and config are kept (install only)
    preconditions:
      - sh: stack/installed.sh
        msg: Run it from the install (default /opt/arr-setup; task deploy makes it), not a source tree.
    cmds:
      - docker compose stop

  status:
    desc: The containers, and when each job's timer runs next
    cmds:
      - docker compose ps
      - echo
      - systemctl list-timers pms-update.timer arr-fallback-search.timer lan-address.timer stack-status.timer stack-status-drift.timer --all --no-pager

  logs:
    desc: Follow the logs (task logs -- plex for one service)
    cmds:
      - docker compose logs -f --tail 100 {{.CLI_ARGS}}

  preflight:
    desc: Read-only checks before a phase (task start runs them too)
    cmds:
      - stack/preflight.sh

  bun:install:
    desc: Install the dev tools (TypeScript, Vite+) exactly as bun.lock says; the install never has them
    preconditions:
      - sh: command -v bun
        msg: bun is not on PATH (proto install bun, then proto pin bun <version> --to global; see the README).
    sources: [package.json, bun.lock]
    generates: [node_modules/.bin/vp, node_modules/.bin/tsc]
    cmds:
      - bun install --frozen-lockfile

  lint:
    desc: shellcheck every script, lint and type-check the TypeScript, and check that compose.yaml renders
    deps: ['bun:install']
    preconditions:
      - sh: command -v shellcheck
        msg: shellcheck not installed (sudo apt install shellcheck)
    cmds:
      - shellcheck -x apps/*/*.sh jobs/*/*.sh stack/*.sh stack/lib/*.sh
      # Vite+ (Oxlint and Oxfmt; vite.config.ts) under Bun, so node is not needed.
      - bun --bun vp check
      - bun --bun tsc --noEmit
      # Placeholder values: this checks the files, not the .env (preflight
      # does that), so it also works in a worktree or a fresh clone.
      - >-
        env PUID=1000 PGID=1000 TZ=UTC APPDATA=/opt/appdata
        PROWLARR_API_KEY=x RADARR_API_KEY=x SONARR_API_KEY=x QBT_ARR_USER=x QBT_ARR_PASS=x
        docker compose --env-file /dev/null --profile '*' config -q

  types:gen:
    desc: Regenerate stack/lib/api/*.d.ts from each app's OpenAPI spec, at the version running here
    deps: ['bun:install']
    cmds:
      - bun stack/lib/api/gen.ts

  types:check:
    desc: Which generated API types are behind the running apps (changes nothing)
    cmds:
      - bun stack/lib/api/gen.ts --check

  fmt:
    desc: Rewrite the stack's TypeScript, JSON and config files in its format (task lint checks it)
    deps: ['bun:install']
    cmds:
      - bun --bun vp fmt

  test:
    desc: The offline test suites (every *.test.sh, and bun test)
    env:
      TASK: '{{.TASK_EXE}}'
    cmds:
      - stack/run-tests.sh

  check:
    desc: Deploy drift and every app's settings drift, in one report (changes nothing)
    cmds:
      - cmd: |
          rc=0
          if [ -e .pms-install ]; then stack/deploy.sh --check || rc=1; else stack/install.sh --check || rc=1; fi
          for app in {{.CONFIGURED}}; do
            echo; echo "── $app"
            "{{.TASK_EXE}}" "$app:check" || rc=1
          done
          exit $rc

  deploy:check:
    desc: Deploy drift only — install out of date, units missing or changed, timers armed wrongly (changes nothing)
    cmds:
      - cmd: stack/install.sh --check
        if: '[ ! -e .pms-install ]'
      - cmd: stack/deploy.sh --check
        if: '[ -e .pms-install ]'

  deploy:
    desc: "From a source: lint, test, build the site, install into /opt/arr-setup (or task deploy -- [--move] DIR), deploy. In the install: re-deploy the units (asks for sudo)"
    cmds:
      - task: lint
        if: '[ ! -e .pms-install ]'
      - task: test
        if: '[ ! -e .pms-install ]'
      - task: site:build
        if: '[ ! -e .pms-install ] && command -v node >/dev/null && command -v pnpm >/dev/null'
      - cmd: 'echo "warning: node or pnpm is not on PATH, so the docs site is not rebuilt" >&2'
        if: '[ ! -e .pms-install ] && ! { command -v node >/dev/null && command -v pnpm >/dev/null; }'
      - cmd: stack/install.sh {{.CLI_ARGS}}
        if: '[ ! -e .pms-install ]'
      - cmd: stack/deploy.sh
        if: '[ -e .pms-install ]'

  update:
    desc: Update every service in UPDATE_SERVICES now (task update -- plex for one)
    cmds:
      - task: pms-update:run

  update:dry:
    desc: Updater rehearsal — pulls, but recreates nothing
    cmds:
      - task: pms-update:dry

  arr:configure:
    desc: Apply Radarr's and Sonarr's settings (after recyclarr:sync, before seerr:configure)
    cmds:
      - task: radarr:configure
      - task: sonarr:configure

  arr:check:
    desc: Report Radarr and Sonarr drift (changes nothing)
    cmds:
      - task: radarr:check
      - task: sonarr:check
