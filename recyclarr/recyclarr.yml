# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# recyclarr.yml — the TRaSH quality profiles and custom formats for Radarr and
# Sonarr. Run on demand, never on a schedule, so scoring changes land when you
# choose and a preview shows them first:
#
#   npm run recyclarr:preview      what a sync would change; changes nothing
#   npm run recyclarr:sync         apply it
#
# Then `npm run arr:configure` and `npm run seerr:configure` (see docs/phases.md →
# Phase 6). Ownership, so no two tools fight:
#   - Recyclarr: the four profiles below (three for movies: the default 4K HDR
#     one, its opt-in "4K HDR or 1080p" variant, and the hand-picked "UHD
#     Fallback") and their formats/scores.
#   - arr-configure.sh: quality SIZES (Radarr 1080p 40, 2160p 150 MB/min; Sonarr
#     1080p no max) — hence no
#     `quality_definition:` here, which would reset them to TRaSH's sizes.
#   - seerr-configure.sh: which profile a request uses by default.
#
# Started from recyclarr/config-templates (v8): radarr/uhd-bluray-web.yml and
# sonarr/web-1080p.yml, with the changes marked CHANGED.

radarr:
  movies-4k-hdr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        # Named because the variant below shares this trash_id (Recyclarr then
        # requires a name on each). Keep it exactly this: Recyclarr's state,
        # arr-configure.sh and seerr-configure.sh all find the profile by name.
        name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        # Upgrades ON here, and only here: a better-scored 4K release (e.g. HDR10+)
        # replaces the first grab. arr-reclaim removes the replaced torrent
        # (`upgraded`); arr-configure.sh keeps every other profile at no-upgrade.
        upgrade:
          allowed: true
          until_quality: UHD 2160p
        # CHANGED: the template ranks Bluray-2160p above a "WEB 2160p" group, and
        # Radarr compares quality BEFORE custom-format score, so any Bluray encode,
        # even from an unknown group with 11 seeders, beat every WEB release,
        # tiered or not (Dune: Part Two, 2026-09-29, over a WEB Tier 01 release with
        # 508). One group makes the score, and so the TRaSH release-group tiers,
        # decide within 4K. Tiered UHD Bluray encodes (1700-1800) still edge out
        # WEB Tier 01 (1700); untiered encoders fall below tiered WEB. Remux stays
        # out (arr-configure.sh), and qualities not listed stay disallowed.
        qualities:
          - name: UHD 2160p
            qualities: [Bluray-2160p, WEBDL-2160p, WEBRip-2160p]
      # CHANGED: not in the template. The same TRaSH profile again, opt-in from
      # Seerr's request options for a film with no 4K HDR release: it takes 4K
      # HDR when there is one, else 1080p, and replaces the 1080p file with 4K
      # HDR when one appears (quality before score; 4K SDR stays -10000, so only
      # HDR replaces it). The CF groups below carry no assign_scores_to, so both
      # profiles get the same formats and scores. Score upgrades also happen
      # within 1080p (e.g. an untiered WEB-DL replaced by a tiered one);
      # arr-reclaim removes the replaced torrent. 1080p x265 without HDR stays
      # rejected, and 1080p Bluray encodes get no tier score (the UHD formats
      # have none). The 1080p qualities are one group for the same reason as the
      # 4K ones. No 720p, no Remux. Radarr only finds a later 4K release through
      # RSS, so tools/arr-fallback-search.sh re-searches these movies weekly.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB, variant
        name: 4K HDR or 1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: UHD 2160p
        min_format_score: 0
        qualities:
          - name: UHD 2160p
            qualities: [Bluray-2160p, WEBDL-2160p, WEBRip-2160p]
          - name: HD 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p]
      # CHANGED (not in the template): a looser 4K profile, picked by hand for a
      # movie that has 4K releases but none UHD Bluray + WEB accepts (Radarr →
      # movie → Edit → Quality Profile, then Search; or Seerr's request
      # options). It is never the default; for a film with no 4K at all,
      # "4K HDR or 1080p" is the one. Same 2160p group, no Remux, the same 150 MB/min cap; but HDR
      # is preferred, not required, and there are no release-group tiers, so
      # among equal scores indexer priority and then seeders decide. LQ groups
      # (YTS, YIFY) pass: the -10000 blockers below are only the files that are
      # broken or fake (disc images, 3D, upscales, DV without HDR fallback, …).
      # No upgrades: move the movie back to UHD Bluray + WEB to have that profile
      # replace the file once a good release appears. Not guide-backed (no
      # trash_id), so the CF groups below never reach it.
      - name: UHD Fallback
        reset_unmatched_scores:
          enabled: true
        min_format_score: 0
        upgrade:
          allowed: false
        qualities:
          - name: UHD 2160p
            qualities: [Bluray-2160p, WEBDL-2160p, WEBRip-2160p]
    # Scores for UHD Fallback, at the guide's scores, since the groups below
    # only reach the guide-backed profiles: the
    # [Unwanted] group minus LQ / LQ (Release Title), DV (w/o HDR fallback),
    # HDR and HDR10+ Boost, and Repack/Proper. Not SDR or x265 (no HDR/DV): both
    # -10000 on the two profiles above, and what most YTS 2160p releases are.
    custom_formats:
      - trash_ids:
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - cae4ca30163749b891686f95532519bd  # AV1
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
          - c465ccc73923871b3eb1802042331306  # Line/Mic Dubbed
          - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
          - 493b6d1dbec3c3364c59d7607f7e3405  # HDR (500)
          - caa37d0df9c348912df1fb1d88f9273a  # HDR10+ Boost (100)
          - e7718d7a3ce595f289bfee26adc178f5  # Repack/Proper
          - ae43b294509409a6a13919dedd4764c4  # Repack2
          - 5caaaa1c08c1742aa4342d8c4cc463f2  # Repack3
        assign_scores_to:
          - name: UHD Fallback
    custom_format_groups:
      add:
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
        # CHANGED: the three below are off in the template. Together with the
        # [HDR Formats] HDR group (synced by default) they are what makes this
        # profile 4K *HDR* rather than just 2160p:
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76  # [HDR Formats] DV (w/o HDR fallback)
        - trash_id: b29413a7487478fe98228ce79e5689e4  # [HDR Formats] HDR10+ Boost
        - trash_id: 47f0d69750de9e16855915fa73bb7b08  # [HDR Formats] SDR
          select:
            - 9c38ebb7384dada637be8899efa68e6f  # SDR

sonarr:
  series-1080p:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true
        # CHANGED: TRaSH's profile upgrades; series here do not (decided for Phase 6).
        upgrade:
          allowed: false
    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
