# pms-arr-setup — the containerized media stack.
#
# Services are added phase by phase; docs/phases.md is the runbook. State lives in ${APPDATA} (on /), never in
# this repo and never on /mnt/data.
#
# Data is mounted at its HOST path (/mnt/data/..., not /data). That keeps the
# Plex database's library paths and qBittorrent's .fastresume paths valid
# across the move. See docs/phases.md → "Rules that span phases".

name: pms

x-common-env: &common-env
  PUID: ${PUID:?set PUID in .env}
  PGID: ${PGID:?set PGID in .env}
  TZ: ${TZ:?set TZ in .env}
  # Group-writable files, as native qbittorrent-nox's UMask=002: the library
  # and the torrent tree are shared through the media group (setgid dirs).
  UMASK: "002"

services:

  # ── Plex ───────────────────────────────────────────────────────────────────
  # Took over from native plexmediaserver in Phase 1b with a copy of its
  # database, so the server identity (f3860770…) and watch history carried over.
  # The native copy stays in /var/lib/plexmediaserver, masked, until Phase 7.
  #
  # Host networking: same ports, GDM discovery and LAN detection as the native
  # server, and pms-local's scripts keep reaching it at localhost:32400.
  # The library is read-write because "Allow media deletion" needs it, and
  # pms-local's plex-watch depends on deletes made in Plex.
  #
  # No GPU: the GTX 560 is too old for Plex's NVENC and there is no /dev/dri
  # render node, so transcoding is CPU — the same as native.
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      <<: *common-env
      VERSION: docker
      # Only read on a first start with an empty /config (a fresh install):
      # claims the new server to the account. Ignored once a config exists.
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - ${APPDATA:?set APPDATA in .env}/plex:/config
      - /mnt/data/streaming:/mnt/data/streaming
    restart: unless-stopped

  # ── Phase 2: qBittorrent (for Radarr/Sonarr) ───────────────────────────────
  # A SECOND instance. Native qbittorrent-nox keeps :8080, peer port 13761, its
  # torrents and the on-complete.sh import hook until Phase 7; pms-local's
  # plex-reconcile only ever sees that one. This one has no hook — the arrs
  # import from it over its API.
  #
  # /mnt/data is ONE bind mount on purpose: Radarr and Sonarr hardlink from
  # torrents/ into streaming/, and link() fails with EXDEV across two bind
  # mounts even on the same filesystem.
  #
  # Settings (paths, categories, port, host header domains) are applied by
  # tools/qbt-configure.sh, not clicked in the WebUI.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8081
      TORRENTING_PORT: 13762
    ports:
      - "8081:8081"
      - "13762:13762"
      - "13762:13762/udp"
    volumes:
      - ${APPDATA:?set APPDATA in .env}/qbittorrent:/config
      - /mnt/data:/mnt/data
    networks: [arr]
    restart: unless-stopped

  # ── Phase 3: Prowlarr + FlareSolverr ───────────────────────────────────────
  # Prowlarr manages the indexers and, from Phase 4, pushes them to Radarr and
  # Sonarr. It only searches: no media mounts at all.
  #
  # The API key and auth mode come from .env, so the key is known before the
  # first start and Phase 4 can use it without copying it out of the UI. The
  # login, FlareSolverr proxy and indexers are applied by
  # tools/prowlarr-configure.sh, not clicked in the WebUI.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:?set PROWLARR_API_KEY in .env}
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "9696:9696"
    volumes:
      - ${APPDATA:?set APPDATA in .env}/prowlarr:/config
    networks: [arr]
    restart: unless-stopped

  # Solves Cloudflare challenges for the indexers tagged `flare` (a headless
  # Chromium, the heavy part of this phase). Not published: only Prowlarr
  # talks to it, as flaresolverr:8191 on the arr network.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: ${TZ:?set TZ in .env}
      LOG_LEVEL: info
    networks: [arr]
    restart: unless-stopped

  # ── Phase 4: Radarr + Sonarr ──────────────────────────────────────────────
  # The first services besides pms-local that write into the library. NEW
  # content only: nothing existing is imported or renamed before Phase 8 — any
  # move under streaming/ reads to pms-local's plex-watch as a Plex deletion.
  #
  # /mnt/data is ONE bind mount: they hardlink from torrents/ into streaming/,
  # and link() fails with EXDEV across two bind mounts on the same filesystem.
  # Plex is host-networked, so they reach it through the host gateway.
  #
  # API keys from .env (fixed before first start, pushed to by Prowlarr); every
  # other setting is applied by tools/arr-configure.sh. Space of a download
  # deleted in Plex is reclaimed by tools/arr-reclaim.sh (arr-reclaim.service).
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?set RADARR_API_KEY in .env}
      RADARR__AUTH__METHOD: Forms
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "7878:7878"
    volumes:
      - ${APPDATA:?set APPDATA in .env}/radarr:/config
      - /mnt/data:/mnt/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [arr]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?set SONARR_API_KEY in .env}
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "8989:8989"
    volumes:
      - ${APPDATA:?set APPDATA in .env}/sonarr:/config
      - /mnt/data:/mnt/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [arr]
    restart: unless-stopped

# Shared by the arr services from Phase 2 on, so they reach each other by
# service name. Host-networked Plex is not on it.
networks:
  arr:
    name: arr
