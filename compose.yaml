# pms-arr-setup — the containerized media stack.
#
# One folder per app: each apps/<app>/compose.yaml holds that service and its
# comments, and this file only pulls them together. docs/phases.md is the
# runbook. State lives in ${APPDATA} (on /), never in this repo and never on
# /mnt/data.
#
# Variables come from the .env beside THIS file: compose loads it for the
# project and passes it to every include. Never put a .env in apps/<app>/.
# A relative bind in an app's compose.yaml (./config.yaml) resolves against
# that app's folder.
#
# Data is mounted at its HOST path (/mnt/data/..., not /data). That keeps the
# Plex database's library paths and qBittorrent's .fastresume paths valid
# across the move. See docs/phases.md → "Rules that span phases".
#
# The project name is fixed: compose run from ANY checkout of this repo,
# worktrees included, acts on the live containers. Change the stack from the
# main clone only (the Taskfile refuses elsewhere).

name: pms

include:
  - apps/plex/compose.yaml
  - apps/qbittorrent/compose.yaml
  - apps/prowlarr/compose.yaml
  - apps/flaresolverr/compose.yaml
  - apps/radarr/compose.yaml
  - apps/sonarr/compose.yaml
  - apps/seerr/compose.yaml
  - apps/recyclarr/compose.yaml
  - apps/decluttarr/compose.yaml
  - apps/bazarr/compose.yaml
  - apps/docs/compose.yaml

# Shared by every service but Plex, so they reach each other by service name.
# Declared here only; the apps reference it. Host-networked Plex is not on it.
networks:
  arr:
    name: arr
